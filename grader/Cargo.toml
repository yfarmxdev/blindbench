[package]
name = "blindbench-grader"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "BlindBench sealed grader: scores one enclave-signed answer against one committed item, inside a TEE"

[[bin]]
name = "blindbench-grader"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
chacha20poly1305 = "0.10"
base64 = "0.22"
hex = "0.4"
unicode-normalization = "0.1"
miniz_oxide = "0.9"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
